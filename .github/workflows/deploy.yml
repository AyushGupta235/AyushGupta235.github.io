name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore private page data
        # The unlisted work page's slug and content are not in this public repo.
        # Without the secret the file is absent and the page is simply not built.
        env:
          PORTFOLIO_YAML_B64: ${{ secrets.PORTFOLIO_YAML_B64 }}
        run: |
          if [ -n "$PORTFOLIO_YAML_B64" ]; then
            mkdir -p site/private
            printf '%s' "$PORTFOLIO_YAML_B64" | base64 -d > site/private/portfolio.yaml
            echo "private page data restored"
          else
            echo "PORTFOLIO_YAML_B64 not set — skipping the unlisted page"
          fi
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          path: ./site
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
